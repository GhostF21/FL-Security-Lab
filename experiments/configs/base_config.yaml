# ─────────────────────────────────────────────────────────
# FL Security Lab — Base Experiment Configuration
# Modify attack/defense sections per experiment, not here
# ─────────────────────────────────────────────────────────

experiment:
  name: "base_fedavg"
  seed: 42                  # Fix random seed for reproducibility
  log_dir: "experiments/logs"
  results_dir: "experiments/results"

federation:
  num_clients: 10           # Total number of simulated clients
  num_rounds: 20           # Communication rounds between server and clients
  fraction_fit: 1.0       # Fraction of clients selected per round (1.0 = all)
  fraction_evaluate: 1.0

data:
  dataset: "mnist"          # "mnist" or "cifar10"
  data_dir: "./data/raw"
  iid: false               # false = non-IID (realistic), true = IID
  dirichlet_alpha: 0.5  # Lower = more skewed non-IID (0.1 = extreme)

model:
  architecture: "SimpleCNN"
  input_channels: 1      # 1 for MNIST, 3 for CIFAR-10
  num_classes: 10

training:
  local_epochs: 2         # Local SGD epochs per client per round
  batch_size: 32
  learning_rate: 0.01
  device: "auto"           # "auto" detects GPU if available, else CPU

attack:
  enabled: false           # No attack in baseline experiment
  type: null
  malicious_fraction: 0.0
  target_class: null

defense:
  aggregation: "fedavg"    # "fedavg", "krum", "trimmed_mean", "median"
  krum_num_to_select: 7  # For Krum: how many updates to aggregate
  trim_fraction: 0.1     # For TrimmedMean: fraction to trim from each end

detection:
  enabled: false
  method: null            # "norm_threshold", "cosine_sim", "pca"
  threshold_sigma: 2.0   # For norm thresholding: µ + sigma * std